# This is a Databricks asset bundle definition for example.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: example
  uuid: a2e59584-5a2a-4618-87bc-9088e8515f51

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  target_table:
    description: Trigger table
  date:
    description: date

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-27c6e772-6907.cloud.databricks.com
    variables:
      target_table: poc.sk_chem_edu.disease_sample
      date: "2025-12-03"
    permissions:
      - user_name: minseong.kim@data-dynamics.io
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-27c6e772-6907.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/minseong.kim@data-dynamics.io to make sure we only have a single copy.
      root_path: /Workspace/Users/minseong.kim@data-dynamics.io/.bundle/${bundle.name}/${bundle.target}
    variables:
      target_table: poc.sk_chem_edu.disease_sample
      date: "2025-12-02"
    permissions:
      - user_name: minseong.kim@data-dynamics.io
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE
