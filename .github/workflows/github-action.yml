name: CI Build and Test

on: [push] # The event that triggers the workflow

jobs:
  build: # The job ID
    runs-on: ubuntu-latest # The runner environment

    steps:
    - name: Print current branch
      run: echo "Current ref name is ${{ github.ref_name }}"
    - uses: actions/checkout@v4 # Action to check out your repository code
    - uses: databricks/setup-cli@main
    - name: Debug host
      run: |
        if [ -z "${DATABRICKS_HOST}" ]; then echo "❌ HOST EMPTY"; exit 1; else echo "✅ HOST exists"; fi
      env:
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_HOST }}
    - name: Debug token
      run: |
        if [ -z "${DATABRICKS_TOKEN}" ]; then echo "❌ TOKEN EMPTY"; exit 1; else echo "✅ Token exists"; fi
      env:
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    - name: Validate bundle
      working-directory: ./example
      env:
        DATABRICKS_AUTH_TYPE: pat
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        databricks bundle validate
    # - name: Deploy bundle
    #   run: databricks bundle deploy -t ${{ github.ref_name }}
