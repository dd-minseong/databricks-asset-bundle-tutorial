# The main pipeline for example

resources:
  pipelines:
    example_etl:
      name: example_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/example_etl"

      libraries:
        - glob:
            include: ../src/example_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
